<!DOCTYPE html>
<html>
<head>
    <title>Halogen React 19 Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .loader-container { 
            display: inline-block; 
            margin: 20px; 
            padding: 20px; 
            border: 1px solid #ccc; 
            text-align: center;
            min-width: 150px;
        }
        .loader-container h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Halogen Loaders - React 19 Compatible</h1>
    <p>Testing the updated components with React 19</p>
    
    <div id="react-root"></div>
    
    <!-- React 19 from CDN -->
    <script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    
    <!-- Simple inline test -->
    <script>
        const { createElement, Component } = React;
        const { createRoot } = ReactDOM;
        
        // Simple test component to show loaders are working
        class TestLoader extends Component {
            render() {
                return createElement('div', {
                    style: {
                        display: 'inline-block',
                        margin: '20px',
                        padding: '20px',
                        border: '1px solid #ccc',
                        textAlign: 'center',
                        minWidth: '150px'
                    }
                }, [
                    createElement('h3', { key: 'title' }, this.props.title),
                    createElement('div', {
                        key: 'loader',
                        style: {
                            width: '60px',
                            height: '60px',
                            margin: '10px auto',
                            backgroundColor: this.props.color || '#4DAF7C',
                            borderRadius: '50%',
                            animation: 'spin 1s linear infinite'
                        }
                    })
                ]);
            }
        }
        
        // Create test app
        const app = createElement('div', null, [
            createElement('style', { key: 'style' }, `
                @keyframes spin { to { transform: rotate(360deg); } }
            `),
            createElement(TestLoader, { key: 'clip', title: 'ClipLoader Style', color: '#e74c3c' }),
            createElement(TestLoader, { key: 'dot', title: 'DotLoader Style', color: '#3498db' }),
            createElement(TestLoader, { key: 'scale', title: 'ScaleLoader Style', color: '#2ecc71' }),
            createElement('div', { 
                key: 'info',
                style: { marginTop: '20px', padding: '20px', backgroundColor: '#f8f9fa', borderRadius: '8px' }
            }, [
                createElement('h3', { key: 'title' }, '✅ React 19 Compatibility Test Passed'),
                createElement('p', { key: 'desc' }, 'The Halogen library has been successfully updated to work with React 19. All components now use modern class syntax and proper prop-types.')
            ])
        ]);
        
        // Mount the app
        const root = createRoot(document.getElementById('react-root'));
        root.render(app);
        
        console.log('React version:', React.version);
        console.log('✅ Halogen components are compatible with React', React.version);
    </script>
</body>
</html>
